name: API contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The Node twin of the guard below (#90): tests/netguard/netguard.mjs refuses any
      # non-loopback connection, DNS lookup or fetch, and fails the run at exit.
      - run: node --import ./tests/netguard/netguard.mjs --test tests/data-api.test.mjs tests/session.test.mjs tests/apikey.test.mjs tests/apikey-tool.test.mjs tests/netguard.test.mjs tests/page-refusals.test.mjs
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NETGUARD_REPORT: '1'
      # No test may reach the network (#87): tests/netguard refuses any non-loopback
      # connection and fails the run at exit, and the dead proxy catches the rest.
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: tests/netguard
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NETGUARD_REPORT: '1'
      - run: python reconstruct.py --check
